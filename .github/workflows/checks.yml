name: Recipe checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  clients-and-build-commands:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install host check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck patch
      - name: Run CPU-only recipe checks
        run: bash scripts/check-local.sh
